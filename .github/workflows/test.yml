name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  octave-smoke:
    name: Octave smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Load EEGLAB sample data
        run: |
          octave --quiet --eval "cd('$GITHUB_WORKSPACE'); eeglab('nogui'); EEG = pop_loadset('filename', 'eeglab_data.set', 'filepath', 'sample_data/'); EEG = eeg_checkset(EEG); assert(EEG.nbchan == size(EEG.data, 1)); assert(EEG.pnts == size(EEG.data, 2)); nEvent = length(EEG.event); baseLat = [EEG.event.latency]; EEGok = eeg_checkset(EEG, 'eventconsistency'); assert(isequal(baseLat, [EEGok.event.latency])); EEGout = EEG; EEGout.event(end+1) = EEGout.event(1); EEGout.event(end).latency = EEG.pnts + 10; EEGout = eeg_checkset(EEGout, 'eventconsistency'); assert(length(EEGout.event) == nEvent); EEGzero = EEG; EEGzero.trials = 0; EEGzero = eeg_checkset(EEGzero, 'eventconsistency'); assert(length(EEGzero.event) == nEvent); assert(EEGzero.trials == 1); EEGstale = EEG; EEGstale.trials = 0; EEGstale = eeg_eegrej(EEGstale, [223 572; 1 140]); EEGref = eeg_eegrej(EEG, [223 572; 1 140]); assert(EEGstale.trials == 1); assert(isequal([EEGstale.event.latency], [EEGref.event.latency]));"

  matlab-smoke:
    name: MATLAB smoke test
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine MATLAB availability
        id: matlab
        shell: bash
        run: |
          if [ -n "$MLM_LICENSE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up MATLAB
        if: steps.matlab.outputs.available == 'true'
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: MATLAB

      - name: Load EEGLAB sample data
        if: steps.matlab.outputs.available == 'true'
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd(getenv('GITHUB_WORKSPACE'));
            eeglab('nogui');
            EEG = pop_loadset('filename', 'eeglab_data.set', 'filepath', 'sample_data/');
            EEG = eeg_checkset(EEG);
            assert(EEG.nbchan == size(EEG.data, 1));
            assert(EEG.pnts == size(EEG.data, 2));
            nEvent = length(EEG.event);
            baseLat = [EEG.event.latency];
            EEGok = eeg_checkset(EEG, 'eventconsistency');
            assert(isequal(baseLat, [EEGok.event.latency]));
            EEGout = EEG;
            EEGout.event(end+1) = EEGout.event(1);
            EEGout.event(end).latency = EEG.pnts + 10;
            EEGout = eeg_checkset(EEGout, 'eventconsistency');
            assert(length(EEGout.event) == nEvent);
            EEGzero = EEG;
            EEGzero.trials = 0;
            EEGzero = eeg_checkset(EEGzero, 'eventconsistency');
            assert(length(EEGzero.event) == nEvent);
            assert(EEGzero.trials == 1);
            EEGstale = EEG;
            EEGstale.trials = 0;
            EEGstale = eeg_eegrej(EEGstale, [223 572; 1 140]);
            EEGref = eeg_eegrej(EEG, [223 572; 1 140]);
            assert(EEGstale.trials == 1);
            assert(isequal([EEGstale.event.latency], [EEGref.event.latency]));

      - name: Skip MATLAB smoke
        if: steps.matlab.outputs.available != 'true'
        run: |
          echo "MATLAB smoke skipped because MATLAB_BATCH_TOKEN is not configured."
